spring.application.name=sales_engine

# SQL Server connection
spring.datasource.url=jdbc:mysql://localhost:3306/IVMS_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
# Hibernate (auto create/update tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server port
server.port=8085

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
